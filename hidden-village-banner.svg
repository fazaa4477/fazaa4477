<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1230"/>
      <stop offset="55%" stop-color="#152040"/>
      <stop offset="100%" stop-color="#2a1f3d"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="60%" stop-color="#ffe9a8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233252"/>
      <stop offset="100%" stop-color="#1a2540"/>
    </linearGradient>
    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141b30"/>
      <stop offset="100%" stop-color="#0c1120"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f2a2a"/>
      <stop offset="100%" stop-color="#5e1717"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a33"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdca0"/>
      <stop offset="100%" stop-color="#ff7a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="420" fill="url(#skyGrad)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="70" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="45" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="55" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="90" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="740" cy="80" r="70" fill="url(#moonGlow)"/>
  <circle cx="740" cy="80" r="34" fill="#fff6da"/>
  <circle cx="752" cy="70" r="6" fill="#f2e3ad" opacity="0.6"/>
  <circle cx="730" cy="92" r="4" fill="#f2e3ad" opacity="0.5"/>

  <!-- drifting clouds -->
  <g fill="#2a3a5c" opacity="0.5">
    <ellipse cx="150" cy="100" rx="90" ry="16">
      <animate attributeName="cx" values="-100;1000" dur="40s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="600" cy="60" rx="70" ry="12">
      <animate attributeName="cx" values="-200;900" dur="55s" begin="8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- far mountains (generic silhouette, no carved faces) -->
  <path d="M0,260 L120,150 L230,240 L330,120 L460,250 L560,160 L700,250 L820,140 L900,240 L900,420 L0,420 Z" fill="url(#mtnFar)"/>
  <!-- near mountains -->
  <path d="M0,320 L160,210 L300,300 L420,190 L600,310 L760,220 L900,300 L900,420 L0,420 Z" fill="url(#mtnNear)"/>

  <!-- village rooftops silhouette row -->
  <g>
    <path d="M40,340 L110,300 L180,340 Z" fill="url(#roofGrad)"/>
    <rect x="55" y="340" width="90" height="40" fill="#1c1420"/>
    <path d="M190,350 L250,315 L310,350 Z" fill="url(#roofGrad)"/>
    <rect x="202" y="350" width="96" height="36" fill="#1c1420"/>
    <path d="M600,350 L665,312 L730,350 Z" fill="url(#roofGrad)"/>
    <rect x="614" y="350" width="102" height="38" fill="#1c1420"/>
    <path d="M740,340 L800,305 L860,340 Z" fill="url(#roofGrad)"/>
    <rect x="752" y="340" width="96" height="40" fill="#1c1420"/>
    <!-- pagoda center -->
    <g transform="translate(450,270)">
      <rect x="-14" y="70" width="28" height="40" fill="#1c1420"/>
      <path d="M-40,70 L0,44 L40,70 Z" fill="url(#roofGrad)"/>
      <rect x="-24" y="44" width="48" height="10" fill="#1c1420"/>
      <path d="M-30,44 L0,20 L30,44 Z" fill="url(#roofGrad)"/>
      <rect x="-16" y="20" width="32" height="8" fill="#1c1420"/>
      <path d="M-20,20 L0,0 L20,20 Z" fill="url(#roofGrad)"/>
      <rect x="-3" y="-10" width="6" height="12" fill="#8a8a8a"/>
    </g>
  </g>

  <!-- lanterns -->
  <g>
    <g transform="translate(120,330)">
      <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="3s" repeatCount="indefinite" additive="sum"/>
      <line x1="0" y1="-18" x2="0" y2="0" stroke="#3a2a1a" stroke-width="2"/>
      <circle r="16" fill="url(#lanternGlow)"/>
      <ellipse rx="9" ry="12" fill="#ff8c42" stroke="#c85a1f" stroke-width="1.5">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.8s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(260,300)">
      <animateTransform attributeName="transform" type="rotate" values="4;-4;4" dur="2.6s" repeatCount="indefinite" additive="sum"/>
      <line x1="0" y1="-18" x2="0" y2="0" stroke="#3a2a1a" stroke-width="2"/>
      <circle r="16" fill="url(#lanternGlow)"/>
      <ellipse rx="9" ry="12" fill="#ff8c42" stroke="#c85a1f" stroke-width="1.5">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="2.1s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(660,308)">
      <animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="2.9s" repeatCount="indefinite" additive="sum"/>
      <line x1="0" y1="-18" x2="0" y2="0" stroke="#3a2a1a" stroke-width="2"/>
      <circle r="16" fill="url(#lanternGlow)"/>
      <ellipse rx="9" ry="12" fill="#ff8c42" stroke="#c85a1f" stroke-width="1.5">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.7s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g transform="translate(800,300)">
      <animateTransform attributeName="transform" type="rotate" values="3;-5;3" dur="3.3s" repeatCount="indefinite" additive="sum"/>
      <line x1="0" y1="-18" x2="0" y2="0" stroke="#3a2a1a" stroke-width="2"/>
      <circle r="16" fill="url(#lanternGlow)"/>
      <ellipse rx="9" ry="12" fill="#ff8c42" stroke="#c85a1f" stroke-width="1.5">
        <animate attributeName="opacity" values="0.85;1;0.85" dur="1.9s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- chimney smoke -->
  <g fill="none" stroke="#cfd6e6" stroke-width="3" opacity="0.35" stroke-linecap="round">
    <path d="M115,300 C110,285 122,278 118,262">
      <animate attributeName="opacity" values="0;0.4;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M805,295 C800,280 812,272 808,256">
      <animate attributeName="opacity" values="0;0.4;0" dur="4.5s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- water reflection at bottom -->
  <rect x="0" y="386" width="900" height="34" fill="url(#waterGrad)"/>
  <g opacity="0.4">
    <rect x="90" y="386" width="4" height="18" fill="#ff8c42">
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="720" y="386" width="4" height="16" fill="#fff6da">
      <animate attributeName="opacity" values="0.3;0.55;0.3" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g stroke="#5b7aa8" stroke-width="1" opacity="0.3">
    <line x1="0" y1="396" x2="900" y2="396">
      <animate attributeName="x1" values="0;20;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="900;920;900" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="408" x2="900" y2="408">
      <animate attributeName="x1" values="10;-10;10" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="910;890;910" dur="3.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- fireflies -->
  <g fill="#c8ffb0">
    <circle cx="200" cy="250" r="2.4">
      <animate attributeName="cy" values="250;220;250" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="200;225;200" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="230" r="2">
      <animate attributeName="cy" values="230;200;230" dur="4.4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="500;480;500" dur="5.4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="360" cy="270" r="2.2">
      <animate attributeName="cy" values="270;240;270" dur="5.6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="360;385;360" dur="6.4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating cherry petals -->
  <g fill="#ff9ec4" opacity="0.75">
    <path d="M0,-6 C4,-4 4,4 0,6 C-4,4 -4,-4 0,-6 Z">
      <animateTransform attributeName="transform" type="translate" values="90,-10;90,430" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;360" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-6 C4,-4 4,4 0,6 C-4,4 -4,-4 0,-6 Z">
      <animateTransform attributeName="transform" type="translate" values="480,-15;480,435" dur="8.5s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;-360" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-6 C4,-4 4,4 0,6 C-4,4 -4,-4 0,-6 Z">
      <animateTransform attributeName="transform" type="translate" values="700,-12;700,432" dur="7.6s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;360" dur="3.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="450" y="130" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffe9c7" opacity="0.92">
    Welcome to the Hidden Village
  </text>
  <text x="450" y="160" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#bcd0f0" opacity="0.85">
    quiet nights, glowing lanterns, and code shipped under the moonlight
  </text>
</svg>
