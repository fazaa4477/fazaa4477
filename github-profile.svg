<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;family=Inter:wght@400;700&amp;display=swap');
      
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12; }
      
      .title { 
        font-family: 'Inter', sans-serif; 
        font-weight: 700; 
        font-size: 36px; 
        fill: #c9d1d9; 
        opacity: 0; 
        animation: fade-in 1s ease-out 0.4s forwards; 
      }
      
      .highlight { fill: #58a6ff; }
      
      .subtitle { 
        font-family: 'Fira Code', monospace; 
        font-size: 16px; 
        fill: #8b949e; 
        opacity: 0; 
        animation: fade-in 1s ease-out 1s forwards; 
      }
      
      .code-symbol { 
        font-family: 'Fira Code', monospace; 
        font-weight: 700; 
        font-size: 48px; 
        fill: #238636; 
        animation: float 3s infinite ease-in-out; 
      }

      .delay { animation-delay: -1.5s; }
      
      @keyframes fade-in {
        0% { opacity: 0; transform: translateX(-15px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <rect class="bg" width="100%" height="100%" />

  <g transform="translate(50, 115)">
    <text class="code-symbol">&lt;</text>
  </g>

  <g transform="translate(110, 95)">
    <text class="title">Hi, I'm <tspan class="highlight">Irtadho Zainul Falah</tspan> 👋</text>
    <text class="subtitle" y="40">&gt; Learner &amp; Student at PENS</text>
  </g>

  <g transform="translate(710, 115)">
    <text class="code-symbol delay">/&gt;</text>
  </g>
</svg>
